[package]
name = "relay-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A three-tier coding agent with read-only planning and isolated evaluation"
license = "MIT"
default-run = "relay"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
diffy = "0.4"
dirs = "6"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
strip = true
